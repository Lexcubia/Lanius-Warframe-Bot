[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save 60 1 --dir /data/redis
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/usr/local/bin/node /app/api/dist/index.js
directory=/app/api
autostart=true
autorestart=true
priority=20
environment=NODE_ENV="production",HOST="0.0.0.0",PORT="8787",LANIUS_CONFIG_ROOT="/config",LANIUS_CONFIG="/config/config.local.yaml",LANIUS_RUNTIME_CONFIG_ROOT="/config"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/node /app/web/.output/server/index.mjs
directory=/app/web
autostart=true
autorestart=true
priority=30
environment=NODE_ENV="production",HOST="0.0.0.0",PORT="8790",NITRO_HOST="0.0.0.0",NITRO_PORT="8790",LANIUS_API_BASE="http://127.0.0.1:8787",NUXT_LANIUS_API_BASE="http://127.0.0.1:8787"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
command=/usr/local/bin/node /app/bot/dist/index.js
directory=/app/bot
autostart=true
autorestart=true
priority=40
environment=NODE_ENV="production",HOST="0.0.0.0",PORT="8788",LANIUS_CONFIG_ROOT="/config",LANIUS_CONFIG="/config/config.local.yaml",LANIUS_API_BASE="http://127.0.0.1:8787",LANIUS_CARD_HOST_DIR="/app/bot/card-host",PLAYWRIGHT_BROWSERS_PATH="/ms-playwright"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
