[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save 60 1 --dir /data/redis
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; API：tsx 直跑 monorepo 源码（/repo 为宿主机挂载）。git pull 后重启容器即生效。
[program:api]
command=/repo/apps/api/node_modules/.bin/tsx /repo/apps/api/src/index.ts
directory=/repo/apps/api
autostart=true
autorestart=true
priority=20
environment=NODE_ENV="production",HOST="0.0.0.0",PORT="8787",LANIUS_CONFIG_ROOT="/config",LANIUS_CONFIG="/config/config.local.yaml",LANIUS_RUNTIME_CONFIG_ROOT="/config"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Web：Nuxt 必须构建，跑 .output 产物（源码挂载后从 /repo/apps/web 构建）。
[program:web]
command=/usr/local/bin/node /repo/apps/web/.output/server/index.mjs
directory=/repo/apps/web
autostart=true
autorestart=true
priority=30
environment=NODE_ENV="production",HOST="0.0.0.0",PORT="8790",NITRO_HOST="0.0.0.0",NITRO_PORT="8790",LANIUS_API_BASE="http://127.0.0.1:8787",NUXT_LANIUS_API_BASE="http://127.0.0.1:8787"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Bot：tsx 直跑源码。Playwright 浏览器在 /ms-playwright。
[program:bot]
command=/repo/apps/bot/node_modules/.bin/tsx /repo/apps/bot/src/index.ts
directory=/repo/apps/bot
autostart=true
autorestart=true
priority=40
environment=NODE_ENV="production",HOST="0.0.0.0",PORT="8788",LANIUS_CONFIG_ROOT="/config",LANIUS_CONFIG="/config/config.local.yaml",LANIUS_API_BASE="http://127.0.0.1:8787",PLAYWRIGHT_BROWSERS_PATH="/ms-playwright"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
