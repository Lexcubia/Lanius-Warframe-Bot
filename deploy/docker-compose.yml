# Lanius 生产编排。在仓库 deploy/ 目录执行：
#   GHCR：IMAGE_TAG=v0.1.0 docker compose pull && docker compose up -d
#   源码构建：IMAGE_TAG=v0.1.0 docker compose build && docker compose up -d
#
# build.context 为仓库根（deploy 的上一级）。

name: lanius

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - bot

  api:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/lexcubia/lanius-warframe-bot}/api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8787'
      LANIUS_CONFIG: /config/config.local.yaml
      # default+local YAML：改文件后重启本服务即可生效
      LANIUS_RUNTIME_CONFIG_ROOT: /runtime-config
    volumes:
      - ${LANIUS_CONFIG_FILE:-./config.local.yaml}:/config/config.local.yaml:ro
      - ${LANIUS_RUNTIME_DEFAULT:-../config/default}:/runtime-config/default:ro
      - ${LANIUS_RUNTIME_LOCAL:-../config/local}:/runtime-config/local:ro
    expose:
      - '8787'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/lexcubia/lanius-warframe-bot}/web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8790'
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '8790'
      # 容器内走 compose 服务名；Nuxt 运行时覆盖用 NUXT_ 前缀
      LANIUS_API_BASE: http://api:8787
      NUXT_LANIUS_API_BASE: http://api:8787
    expose:
      - '8790'
    depends_on:
      api:
        condition: service_healthy

  bot:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/lexcubia/lanius-warframe-bot}/bot:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8788'
      LANIUS_CONFIG: /config/config.local.yaml
      # 覆盖 YAML 中的本机地址，指向 compose 内网 api
      LANIUS_API_BASE: http://api:8787
      PUBLIC_SITE_BASE_URL: ${PUBLIC_SITE_BASE_URL:-https://localhost}
      # Vue 卡片宿主预构建目录（镜像内路径；Playwright 节点截图）
      LANIUS_CARD_HOST_DIR: /app/card-host
      # 浏览器二进制来自宿主机预装目录（deploy/prepare-playwright.sh），不在镜像内下载
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ${LANIUS_CONFIG_FILE:-./config.local.yaml}:/config/config.local.yaml:ro
      - ${LANIUS_PLAYWRIGHT_DIR:-/opt/lanius/ms-playwright}:/ms-playwright:ro
    expose:
      - '8788'
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
