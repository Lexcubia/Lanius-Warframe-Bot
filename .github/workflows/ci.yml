# 轻量 CI：install + 单测 + typecheck。
# 不装 Playwright/Chromium（浏览器截图测默认在 CI 跳过；本地可 LANIUS_BROWSER_TESTS=1）。
# 发版硬约束：develop → main → release。仅 PR/push → develop|main 跑检查；
# `release` 只跟 main 上线，不做检查（见 deploy-release.yml）。

name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: install-test-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
