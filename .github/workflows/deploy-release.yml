# 长期分支 `release`：SSH 自动部署（默认 Node）。
# 机房直连 github.com 常失败：Actions checkout 打 tarball → scp → apply-node-release.sh。
# 可选 runtime=docker → 旧 update-image.sh（GHCR pull）。

name: Deploy release branch

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'checkout 的 tag/分支（如 v0.4.0）；默认读仓库 package.json version 加 v 前缀'
        required: false
        type: string
      runtime:
        description: 'node（默认）或 docker（可选镜像路径）'
        required: false
        type: choice
        options:
          - node
          - docker
        default: node

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-release
    if: github.repository == 'Lexcubia/Lanius-Warframe-Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Resolve release ref
        id: meta
        run: |
          REF='${{ inputs.release_ref }}'
          if [ -z "$REF" ]; then
            # push 事件时稍后从 checkout 的 package.json 读；此处先占位
            REF=''
          fi
          RUNTIME='${{ inputs.runtime }}'
          if [ -z "$RUNTIME" ]; then
            RUNTIME='node'
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "runtime=${RUNTIME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # 默认打 release 分支当前树（含部署脚本热修）；可 workflow_dispatch 指定 tag
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Finalize ref from package.json
        id: ver
        run: |
          REF='${{ steps.meta.outputs.ref }}'
          if [ -z "$REF" ]; then
            VER="$(node -p "require('./package.json').version")"
            REF="v${VER}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "runtime=${{ steps.meta.outputs.runtime }}" >> "$GITHUB_OUTPUT"
          echo "Using REF=${REF} RUNTIME=${{ steps.meta.outputs.runtime }} SHA=$(git rev-parse --short HEAD)"

      - name: Pack source tarball
        if: steps.ver.outputs.runtime == 'node'
        run: |
          REF='${{ steps.ver.outputs.ref }}'
          mkdir -p .deploy-pack
          # 打当前 checkout 树（release 分支），避免仅 checkout 旧 tag 时缺部署脚本
          tar \
            --exclude='./.git' \
            --exclude='./.deploy-pack' \
            --exclude='./node_modules' \
            --exclude='./apps/*/node_modules' \
            --exclude='./packages/*/node_modules' \
            --exclude='./apps/web/.nuxt' \
            --exclude='./apps/web/.output' \
            --exclude='./config/local' \
            --exclude='./data' \
            -czf ".deploy-pack/lanius-${REF}.tgz" .
          cp deploy/apply-node-release.sh deploy/update-node.sh \
            deploy/install-node-services.sh deploy/prepare-playwright.sh \
            deploy/Caddyfile.node .deploy-pack/
          mkdir -p .deploy-pack/systemd
          cp deploy/systemd/* .deploy-pack/systemd/
          ls -lh .deploy-pack/

      - name: SCP tarball and deploy scripts
        if: steps.ver.outputs.runtime == 'node'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: '.deploy-pack/*'
          target: '/opt/lanius/upload'
          strip_components: 1
          overwrite: true

      - name: Apply Node release over SSH
        if: steps.ver.outputs.runtime == 'node'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 80m
          script: |
            set -euo pipefail
            REF='${{ steps.ver.outputs.ref }}'
            DEPLOY_DIR='${{ secrets.DEPLOY_PATH }}'
            REPO_ROOT="$(cd "${DEPLOY_DIR}/.." && pwd)"
            mkdir -p /opt/lanius/releases "${REPO_ROOT}/deploy/systemd"
            # scp 可能落到 upload/ 或 upload/tmp/...
            # strip_components=1 后文件在 /opt/lanius/upload/
            TB="/opt/lanius/upload/lanius-${REF}.tgz"
            if [ ! -f "${TB}" ]; then
              TB=$(find /opt/lanius/upload -type f -name "lanius-${REF}.tgz" 2>/dev/null | head -1 || true)
            fi
            if [ -z "${TB}" ] || [ ! -f "${TB}" ]; then
              echo "tarball not found under /opt/lanius/upload" >&2
              find /opt/lanius/upload -type f 2>/dev/null | head -50 || true
              exit 1
            fi
            cp -f "${TB}" "/opt/lanius/releases/lanius-${REF}.tgz"
            mkdir -p "${REPO_ROOT}/deploy/systemd"
            for f in apply-node-release.sh update-node.sh install-node-services.sh prepare-playwright.sh Caddyfile.node; do
              if [ -f "/opt/lanius/upload/${f}" ]; then
                cp -f "/opt/lanius/upload/${f}" "${REPO_ROOT}/deploy/"
              fi
            done
            if [ -d /opt/lanius/upload/systemd ]; then
              cp -f /opt/lanius/upload/systemd/* "${REPO_ROOT}/deploy/systemd/" || true
            fi
            chmod +x "${REPO_ROOT}/deploy/"*.sh
            export LANIUS_REPO="${REPO_ROOT}"
            export LANIUS_TARBALL="/opt/lanius/releases/lanius-${REF}.tgz"
            export LANIUS_PLAYWRIGHT_DIR="${LANIUS_PLAYWRIGHT_DIR:-/opt/lanius/ms-playwright}"
            export NPM_CONFIG_REGISTRY="${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}"
            bash "${REPO_ROOT}/deploy/apply-node-release.sh" "${REF}"
            journalctl -u lanius-api -u lanius-bot -u lanius-web -n 80 --no-pager 2>&1 || true
            curl -fsS "https://${DOMAIN:-warframe.lexcubia.com}/api/lanius/v1/health" || \
              curl -fsS "http://127.0.0.1:8787/v1/health" || \
              curl -fsS "http://127.0.0.1/api/lanius/v1/health"

      - name: Deploy Docker path over SSH (optional)
        if: steps.ver.outputs.runtime == 'docker'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            DEPLOY_DIR='${{ secrets.DEPLOY_PATH }}'
            REF='${{ steps.ver.outputs.ref }}'
            cd "${DEPLOY_DIR}"
            export IMAGE_TAG="${REF}"
            export GHCR_IMAGE_PREFIX='ghcr.io/lexcubia/lanius-warframe-bot'
            export COMPOSE_FILE=docker-compose.app.yml
            bash ./update-image.sh "${REF}"
            docker logs lanius-lanius-app-1 --tail 100 2>&1 || true
            curl -fsS "https://${DOMAIN:-warframe.lexcubia.com}/api/lanius/v1/health" || \
              curl -fsS "http://127.0.0.1/api/lanius/v1/health"
