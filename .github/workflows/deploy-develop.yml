# 将 develop 源码同步到生产并 compose build（不经 tag / GHCR）。
# 用于热修回调验签等需尽快上线的改动。

name: Deploy develop

on:
  workflow_dispatch:
    inputs:
      service:
        description: '仅重建的 compose 服务（空=全部）'
        required: false
        default: 'bot'
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-develop-production
    if: github.repository == 'Lexcubia/Lanius-Warframe-Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Deploy develop over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 50m
          script: |
            set -euo pipefail
            DEPLOY_DIR='${{ secrets.DEPLOY_PATH }}'
            REPO_ROOT="$(cd "${DEPLOY_DIR}/.." && pwd)"
            SECRETS_FILE="${LANIUS_SECRETS_FILE:-/opt/lanius/secrets/config.local.yaml}"
            SERVICE='${{ inputs.service }}'
            test -f "${SECRETS_FILE}" || { echo "missing ${SECRETS_FILE}"; exit 1; }
            cd "${REPO_ROOT}"
            # 生产 clone 常为浅克隆/无 remote-tracking；fetch 进本地 develop 再硬对齐
            git fetch --force origin "refs/heads/develop:refs/heads/develop"
            git checkout -f develop
            git log -1 --oneline
            cd "${DEPLOY_DIR}"
            if [ -f .env ]; then
              grep -q '^LANIUS_CONFIG_FILE=' .env || echo "LANIUS_CONFIG_FILE=${SECRETS_FILE}" >> .env
              sed -i "s|^LANIUS_CONFIG_FILE=.*|LANIUS_CONFIG_FILE=${SECRETS_FILE}|" .env
            fi
            if [ -n "${SERVICE}" ]; then
              docker compose build "${SERVICE}"
              docker compose up -d "${SERVICE}"
            else
              docker compose build
              docker compose up -d
            fi
            docker compose ps
            curl -fsS "https://${DOMAIN:-warframe.lexcubia.com}/api/lanius/v1/health" || \
              curl -fsS "http://127.0.0.1/api/lanius/v1/health"
