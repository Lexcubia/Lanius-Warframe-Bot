# 构建推送 GHCR 并 SSH 部署。
# 触发：v* tag / 手动 / 由 auto-tag-on-main 经 workflow_call 调用。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag（如 v0.1.0）；留空则用 github.ref_name'
        required: false
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: '镜像与部署使用的 tag（如 v0.1.0）'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/lexcubia/lanius-warframe-bot

jobs:
  test:
    name: pre-release-test
    if: github.repository == 'Lexcubia/Lanius-Warframe-Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  build-push:
    name: build-and-push-images
    needs: test
    if: github.repository == 'Lexcubia/Lanius-Warframe-Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: api
            file: apps/api/Dockerfile
          - app: web
            file: apps/web/Dockerfile
          - app: bot
            file: apps/bot/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          TAG='${{ inputs.image_tag }}'
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prefix=${IMAGE_PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/${{ matrix.app }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: deploy-production
    needs: build-push
    if: github.repository == 'Lexcubia/Lanius-Warframe-Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Resolve image tag
        id: meta
        run: |
          TAG='${{ inputs.image_tag }}'
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export IMAGE_TAG='${{ steps.meta.outputs.tag }}'
            export GHCR_IMAGE_PREFIX='ghcr.io/lexcubia/lanius-warframe-bot'
            # 拉取公开/私有 GHCR 镜像（若包为 private，服务器需事先 docker login ghcr.io）
            docker compose pull
            docker compose up -d
            docker compose ps
