# 构建推送 GHCR 并 SSH 部署。
# 触发：v* tag / 手动 / 由 auto-tag-on-main 经 workflow_call 调用。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag（如 v0.1.0）；留空则用 github.ref_name'
        required: false
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: '镜像与部署使用的 tag（如 v0.1.0）'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/lexcubia/lanius-warframe-bot

jobs:
  test:
    name: pre-release-test
    if: github.repository == 'Lexcubia/Lanius-Warframe-Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @lanius/render exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm typecheck

  build-push:
    name: build-and-push-images
    needs: test
    if: github.repository == 'Lexcubia/Lanius-Warframe-Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: api
            file: apps/api/Dockerfile
          - app: web
            file: apps/web/Dockerfile
          - app: bot
            file: apps/bot/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          TAG='${{ inputs.image_tag }}'
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prefix=${IMAGE_PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/${{ matrix.app }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: deploy-production
    needs: build-push
    if: github.repository == 'Lexcubia/Lanius-Warframe-Bot'
    runs-on: ubuntu-latest
    # 服务器源码构建（国内机房拉 GHCR 层常极慢）；含 node 镜像与三服务 build
    timeout-minutes: 60
    environment: production
    steps:
      - name: Resolve image tag
        id: meta
        run: |
          TAG='${{ inputs.image_tag }}'
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 50m
          script: |
            set -euo pipefail
            DEPLOY_DIR='${{ secrets.DEPLOY_PATH }}'
            REPO_ROOT="$(cd "${DEPLOY_DIR}/.." && pwd)"
            TAG='${{ steps.meta.outputs.tag }}'
            # 密钥在仓库外；禁止写回 repo/deploy/config.local.yaml
            SECRETS_FILE="${LANIUS_SECRETS_FILE:-/opt/lanius/secrets/config.local.yaml}"
            test -f "${SECRETS_FILE}" || { echo "missing ${SECRETS_FILE}"; exit 1; }
            cd "${REPO_ROOT}"
            git fetch --tags --force origin
            git checkout -f "tags/${TAG}"
            cd "${DEPLOY_DIR}"
            # 确保 .env 指向仓库外密钥（不被 checkout 清掉；.env 本身也在 deploy/.gitignore）
            if [ -f .env ]; then
              grep -q '^LANIUS_CONFIG_FILE=' .env || echo "LANIUS_CONFIG_FILE=${SECRETS_FILE}" >> .env
              sed -i "s|^LANIUS_CONFIG_FILE=.*|LANIUS_CONFIG_FILE=${SECRETS_FILE}|" .env
            fi
            export IMAGE_TAG="${TAG}"
            export GHCR_IMAGE_PREFIX='ghcr.io/lexcubia/lanius-warframe-bot'
            PLAYWRIGHT_DIR="${LANIUS_PLAYWRIGHT_DIR:-/opt/lanius/ms-playwright}"
            # Chromium 须预先装在宿主机；build 不再下载浏览器（见 deploy/prepare-playwright.sh）
            if ! compgen -G "${PLAYWRIGHT_DIR}/chromium-*" > /dev/null; then
              echo "missing Playwright Chromium under ${PLAYWRIGHT_DIR}"
              echo "on the server run: bash ${REPO_ROOT}/deploy/prepare-playwright.sh"
              exit 1
            fi
            export LANIUS_PLAYWRIGHT_DIR="${PLAYWRIGHT_DIR}"
            # 国内链路优先源码 build；GHCR 镜像仍由上游 job 推送作备份
            docker compose build
            docker compose up -d
            docker compose ps
            curl -fsS "https://${DOMAIN:-warframe.lexcubia.com}/api/lanius/v1/health" || \
              curl -fsS "http://127.0.0.1/api/lanius/v1/health"
