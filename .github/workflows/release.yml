# 可选：构建推送 GHCR（不 SSH 部署）。生产默认走 Node，不依赖本产物。
# 不做 test/typecheck（依赖 develop/PR 已绿）；不装 Playwright。
# 部署见 deploy-release.yml（长期分支 release → 热启动/update）。
# 触发：v* tag / 手动 / 由 auto-tag-on-main 经 workflow_call 调用。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag（如 v0.1.0）；留空则用 github.ref_name'
        required: false
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: '镜像 tag（如 v0.1.0）'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/lexcubia/lanius-warframe-bot

jobs:
  build-push:
    name: build-and-push-images
    if: github.repository == 'Lexcubia/Lanius-Warframe-Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: lanius-app
            file: deploy/Dockerfile.app
          - app: api
            file: apps/api/Dockerfile
          - app: web
            file: apps/web/Dockerfile
          - app: bot
            file: apps/bot/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          TAG='${{ inputs.image_tag }}'
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prefix=${IMAGE_PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/${{ matrix.app }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
